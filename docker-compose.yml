services:
  web:
    build: .
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_PATH: /data/sudoku.db
    volumes:
      - sudoku-data:/data
    # Not published: only reachable through the web container.
    expose:
      - "8000"
    restart: unless-stopped

volumes:
  sudoku-data:
